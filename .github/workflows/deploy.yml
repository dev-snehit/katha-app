name: Deploy Kaatha Wholesale to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify documentation & flowchart sync
        if: github.event_name == 'push'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          if echo "$CHANGED" | grep -qE '^(src|backend)/'; then
            echo "$CHANGED" | grep -qE '^docs/MODULES_AND_FLOWCHARTS\.md$' || (echo "Missing docs/MODULES_AND_FLOWCHARTS.md update" && exit 1)
            echo "$CHANGED" | grep -qE '^docs/CHANGE_LOG_AND_PROMPTS\.md$' || (echo "Missing docs/CHANGE_LOG_AND_PROMPTS.md update" && exit 1)
          fi

      - name: Run full hard validation (typecheck, lint, format, docs, build, tests)
        run: npm run validate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
